[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "testpilot-wf"
version = "1.2.0"
description = "Two-agent pytest workflow with independent evidence-driven diagnosis"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2", "langchain-openai>=1.0,<2", "langchain-core>=1.0,<2",
  "pydantic>=2.10,<3", "PyYAML>=6,<7", "pytest>=8,<10", "pytest-cov>=6,<8",
  "coverage>=7.6,<8", "packaging>=24", "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
web = ["streamlit>=1.65,<2"]
dev = ["ruff>=0.9", "build>=1.2"]

[project.scripts]
testpilot = "testpilot.ui.cli:main"
testpilot-wf = "testpilot_wf.cli:main"

[tool.setuptools.packages.find]
include = ["testpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: opt-in real DeepSeek API requests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["runs", "docs/evidence"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
